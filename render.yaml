services:
  - type: web
    name: jarvis-mark-ii
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: JARVIS_ACCESS_TOKEN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
